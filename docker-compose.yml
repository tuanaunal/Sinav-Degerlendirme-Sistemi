# Sınav Değerlendirme Sistemi: PostgreSQL + ASP.NET Core API + Nginx (React arayüzü)
# Kullanım: .env.example dosyasını .env olarak kopyalayıp değerleri doldurun, ardından
#   docker compose up -d --build
# Uygulama: http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sds
      POSTGRES_USER: sds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env dosyasında POSTGRES_PASSWORD tanımlanmalı}
      # Türkçe sıralama sorunlarını önlemek için C yerel ayarı (yerel kurulumla aynı)
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    volumes:
      - sds-veri:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sds -d sds"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Sds.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=sds;Username=sds;Password=${POSTGRES_PASSWORD}
      Jwt__Anahtar: ${JWT_ANAHTAR:?.env dosyasında JWT_ANAHTAR tanımlanmalı (en az 32 karakter)}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  sds-veri:
