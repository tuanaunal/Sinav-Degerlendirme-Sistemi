name: CI

on:
  push:
    branches: [main]
    tags: ["asama-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (derleme ve testler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Sds.sln
      - run: dotnet build Sds.sln -c Release --no-restore
      - run: dotnet test backend/Sds.Tests -c Release --no-build --logger "trx;LogFileName=sonuclar.trx" --results-directory test-sonuclari
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-sonuclari
          path: test-sonuclari

  frontend:
    name: Frontend (lint ve derleme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker (imajlar ve duman testi)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-parolasi
    steps:
      - uses: actions/checkout@v4
      - name: Rastgele JWT anahtarı
        run: echo "JWT_ANAHTAR=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: docker compose build
      - run: docker compose up -d
      - name: Nginx üzerinden API ve arayüz yanıt veriyor mu
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/api/saglik && break
            sleep 2
          done
          curl -fs http://localhost:8080/api/saglik
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          curl -fs http://localhost:8080/dersler/1/donem | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/dersler)" = "401"
      - name: Konteyner günlükleri
        if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
